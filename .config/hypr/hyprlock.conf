# ABOUTME: Hyprlock lock screen config
# ABOUTME: Nord-themed lock screen with clock and password input

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.15
    outer_color = rgb(88c0d0)
    inner_color = rgb(2e3440)
    font_color = rgb(d8dee9)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%I:%M %p"
    font_size = 72
    font_family = JetBrains Mono
    color = rgb(d8dee9)
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = Hi, $USER
    font_size = 18
    font_family = JetBrains Mono
    color = rgb(88c0d0)
    position = 0, 20
    halign = center
    valign = center
}
