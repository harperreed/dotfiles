# ABOUTME: Hypridle config - auto-lock and screen off on inactivity
# ABOUTME: 5 min → lock, 10 min → screen off, 30 min → suspend

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Dim screen after 1 minute (battery only)
listener {
    timeout = 60
    on-timeout = sh -c 'cat /sys/class/power_supply/BAT0/status | grep -q Discharging && brightnessctl -s set 10'
    on-resume = brightnessctl -r
}

# Lock screen after 1.5 minutes
listener {
    timeout = 90
    on-timeout = loginctl lock-session
}

# Turn off display after 3 minutes (battery only)
listener {
    timeout = 180
    on-timeout = sh -c 'cat /sys/class/power_supply/BAT0/status | grep -q Discharging && hyprctl dispatch dpms off'
    on-resume = hyprctl dispatch dpms on
}

# Suspend after 10 minutes (only on battery)
listener {
    timeout = 600
    on-timeout = sh -c 'cat /sys/class/power_supply/BAT*/status | grep -q Discharging && systemctl suspend'
}
