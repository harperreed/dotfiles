# ABOUTME: Main Hyprland compositor configuration
# ABOUTME: Keybinds, window rules, startup apps, and tiling behavior

# ── Monitor ──────────────────────────────────────────────
# Auto-detect monitors. Adjust if you have a specific setup.
monitor=,preferred,auto,1.0

# ── Startup ──────────────────────────────────────────────
exec-once = waybar
exec-once = hyprpaper
exec-once = hypridle
exec-once = hyprpolkitagent
exec-once = dunst
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = swayosd-server
exec-once = nm-applet --indicator
exec-once = gammastep
exec-once = eval $(ssh-agent -s)
exec-once = ~/.config/hypr/battery-watch.sh

# ── Environment ──────────────────────────────────────────
env = XCURSOR_SIZE,24
env = SSH_AUTH_SOCK,$XDG_RUNTIME_DIR/ssh-agent.socket
env = QT_QPA_PLATFORMTHEME,qt6ct

# ── Theme (general, decoration, animations) ─────────────
source = $HOME/.config/hypr/themes/active.conf

# ── Tiling ───────────────────────────────────────────────
dwindle {
    preserve_split = true
    force_split = 2
}

# ── Misc ─────────────────────────────────────────────────
misc {
    middle_click_paste = false
}

# ── Input ────────────────────────────────────────────────
input {
    kb_layout = us
    kb_options = caps:escape
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        middle_button_emulation = false
        clickfinger_behavior = 1
        tap-and-drag = true
    }
}

# ── Gestures ─────────────────────────────────────────────
gesture = 3, l, workspace, e+1
gesture = 3, r, workspace, e-1

# ── Keybinds ─────────────────────────────────────────────
# SUPER = Mod key (Windows/Command key)
$mod = SUPER

# Core
bind = $mod, Return, exec, ghostty
bind = $mod, backslash, exec, ghostty -e fish -c 'cd ~ && cc-continue'
bind = $mod SHIFT, Return, exec, kitty
bind = $mod, D, exec, wofi --show drun
bind = $mod, Q, killactive,
bind = $mod SHIFT, E, exec, wlogout -b 5 -c 20 -r 0 -m 300
bind = $mod, F, fullscreen, 0
bind = $mod, V, togglefloating,
bind = $mod, P, pseudo,
bind = $mod, S, layoutmsg, togglesplit

# Focus (vim-style)
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# Arrow keys cycle workspaces (left/right) and focus (up/down)
bind = $mod, left, workspace, e-1
bind = $mod, right, workspace, e+1
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Move windows (vim-style)
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d

# Resize
bind = $mod CTRL, H, resizeactive, -40 0
bind = $mod CTRL, L, resizeactive, 40 0
bind = $mod CTRL, K, resizeactive, 0 -40
bind = $mod CTRL, J, resizeactive, 0 40

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move window to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Scroll through workspaces
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Mouse binds
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Lock screen
bind = $mod SHIFT, X, exec, hyprlock

# Screenshot (needs grim + slurp)
bind = , Print, exec, grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png

# Browser
bind = $mod, Shift_R, exec, google-chrome-stable

# File manager
bind = $mod, E, exec, thunar

# Clipboard history
bind = $mod SHIFT, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Media keys (via swayosd for on-screen display)
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindl = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindl = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Brightness (via swayosd for on-screen display)
bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

# Caps lock OSD
bindl = , Caps_Lock, exec, swayosd-client --caps-lock

# App drawer (full-screen app grid)
bind = $mod, A, exec, nwg-drawer

# ── Alt-Tab / Super-Tab window switching ─────────────────
bind = ALT, Tab, cyclenext,
bind = ALT SHIFT, Tab, cyclenext, prev
bind = ALT, Tab, bringactivetotop,
bind = $mod, Tab, exec, hyprctl dispatch cyclenext
bind = $mod SHIFT, Tab, exec, hyprctl dispatch cyclenext prev

# ── Scratchpads ──────────────────────────────────────────
bind = $mod, grave, togglespecialworkspace, term
bind = $mod SHIFT, grave, movetoworkspace, special:term
windowrule = match:workspace special:term, float on, size 80% 70%, center on, opacity 0.95 override


# ── Inactive window opacity ───────────────────────────────
windowrule = opacity 1.0 override 0.85 override

# ── Window rules ─────────────────────────────────────────
windowrule = match:title nmtui, float on, size 600 400, center on

# ── Per-workspace layouts ────────────────────────────────
# Workspace 1 (terminals): master layout; rest use dwindle
workspace = 1, layoutopt:orientation:left, layout:master

