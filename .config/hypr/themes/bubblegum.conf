# ABOUTME: Hyprland theme - Bubblegum, pastel candy borders, aggressively cute
# ABOUTME: Fat rounding, wide gaps, colorful borders, heavy shadows

general {
    gaps_in = 6
    gaps_out = 14
    border_size = 3
    col.active_border = rgba(ff6b9dff) rgba(c56cf0ff) rgba(48dbfbff) 45deg
    col.inactive_border = rgba(ccccdd44)
    layout = dwindle
}

decoration {
    rounding = 16
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(ff6b9d33)
    }
}

animations {
    enabled = true
    bezier = bouncy, 0.05, 0.9, 0.15, 1.15
    animation = windows, 1, 6, bouncy
    animation = windowsOut, 1, 5, bouncy, popin 60%
    animation = fade, 1, 5, bouncy
    animation = workspaces, 1, 5, bouncy
}
