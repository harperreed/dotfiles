# ABOUTME: Hyprland theme - Brutalist, zero rounding, thick red borders
# ABOUTME: Raw concrete, no blur, no shadows, zero gaps, hard edges

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 4
    col.active_border = rgba(ff0000ff)
    col.inactive_border = rgba(333333ff)
    layout = dwindle
}

decoration {
    rounding = 0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = instant, 0.0, 1.0, 0.0, 1.0
    animation = windows, 1, 1, instant
    animation = windowsOut, 1, 1, instant
    animation = fade, 1, 1, instant
    animation = workspaces, 1, 1, instant
}
