# ABOUTME: Hyprland theme - Solarized Dark, teal borders, classic look
# ABOUTME: Clean lines, moderate rounding, understated elegance

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(2aa198ff) rgba(268bd2ff) 45deg
    col.inactive_border = rgba(073642aa)
    layout = dwindle
}

decoration {
    rounding = 6
    blur {
        enabled = true
        size = 5
        passes = 2
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 10
        render_power = 2
        color = rgba(002b36cc)
    }
}

animations {
    enabled = true
    bezier = snappy, 0.05, 0.9, 0.1, 1.0
    animation = windows, 1, 4, snappy
    animation = windowsOut, 1, 4, snappy, popin 80%
    animation = fade, 1, 4, snappy
    animation = workspaces, 1, 3, snappy
}
