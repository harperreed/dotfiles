# ABOUTME: Hyprland theme - Tokyo Night, blue-violet glow, night city feel
# ABOUTME: Deep blue shadows, medium rounding, smooth transitions

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(7aa2f7ff) rgba(bb9af7ff) 45deg
    col.inactive_border = rgba(292e42aa)
    layout = dwindle
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 14
        render_power = 3
        color = rgba(1a1b26dd)
    }
}

animations {
    enabled = true
    bezier = smooth, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, smooth
    animation = windowsOut, 1, 4, smooth, popin 80%
    animation = fade, 1, 4, smooth
    animation = workspaces, 1, 3, smooth
}
