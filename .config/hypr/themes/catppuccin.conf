# ABOUTME: Hyprland theme - Catppuccin Mocha, soft rounded windows
# ABOUTME: Warm pastels, gentle shadows, cozy feel

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(cba6f7ff) rgba(89b4faff) 45deg
    col.inactive_border = rgba(313244aa)
    layout = dwindle
}

decoration {
    rounding = 12
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 16
        render_power = 3
        color = rgba(11111bee)
    }
}

animations {
    enabled = true
    bezier = snappy, 0.05, 0.9, 0.1, 1.0
    animation = windows, 1, 4, snappy
    animation = windowsOut, 1, 4, snappy, popin 80%
    animation = fade, 1, 4, snappy
    animation = workspaces, 1, 3, snappy
}
