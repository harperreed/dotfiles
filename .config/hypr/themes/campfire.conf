# ABOUTME: Hyprland theme - Campfire, ember glow on charcoal night
# ABOUTME: Warm orange borders, moderate rounding, dark warm shadows

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(ff6a00ff) rgba(ffaa44ff) 45deg
    col.inactive_border = rgba(281910aa)
    layout = dwindle
}

decoration {
    rounding = 8
    blur {
        enabled = true
        size = 5
        passes = 2
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 14
        render_power = 3
        color = rgba(ff6a0022)
    }
}

animations {
    enabled = true
    bezier = warm, 0.1, 0.85, 0.2, 1.0
    animation = windows, 1, 5, warm
    animation = windowsOut, 1, 5, warm, popin 80%
    animation = fade, 1, 5, warm
    animation = workspaces, 1, 4, warm
}
