# ABOUTME: Hyprland theme - Vaporwave, hot pink and teal neon glow
# ABOUTME: A E S T H E T I C borders, pink shadows, wide gaps

general {
    gaps_in = 6
    gaps_out = 14
    border_size = 3
    col.active_border = rgba(ff71ceff) rgba(01cdfeff) 135deg
    col.inactive_border = rgba(1e003288)
    layout = dwindle
}

decoration {
    rounding = 14
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 24
        render_power = 4
        color = rgba(ff71ce44)
    }
}

animations {
    enabled = true
    bezier = vapor, 0.0, 0.8, 0.2, 1.1
    animation = windows, 1, 6, vapor
    animation = windowsOut, 1, 6, vapor, popin 70%
    animation = fade, 1, 5, vapor
    animation = workspaces, 1, 5, vapor
}
