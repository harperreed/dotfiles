# ABOUTME: Hyprland theme - Dracula, purple glow with pink accents
# ABOUTME: Medium rounding, purple shadows, smooth animations

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(bd93f9ff) rgba(ff79c6ff) 45deg
    col.inactive_border = rgba(44475aaa)
    layout = dwindle
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 16
        render_power = 3
        color = rgba(1e1e2ecc)
    }
}

animations {
    enabled = true
    bezier = smooth, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, smooth
    animation = windowsOut, 1, 5, smooth, popin 80%
    animation = fade, 1, 4, smooth
    animation = workspaces, 1, 4, smooth
}
