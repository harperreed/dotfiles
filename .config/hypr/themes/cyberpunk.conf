# ABOUTME: Hyprland theme - Cyberpunk, neon glow borders, sharp edges
# ABOUTME: Hot pink active, cyan hover energy, tight gaps

general {
    gaps_in = 2
    gaps_out = 4
    border_size = 3
    col.active_border = rgba(ff0066ff) rgba(00ffffff) 90deg
    col.inactive_border = rgba(0a0a12cc)
    layout = dwindle
}

decoration {
    rounding = 2
    blur {
        enabled = true
        size = 4
        passes = 1
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 20
        render_power = 4
        color = rgba(ff006644)
    }
}

animations {
    enabled = true
    bezier = cyber, 0.0, 0.85, 0.15, 1.0
    animation = windows, 1, 3, cyber
    animation = windowsOut, 1, 3, cyber, popin 90%
    animation = fade, 1, 2, cyber
    animation = workspaces, 1, 2, cyber
}
