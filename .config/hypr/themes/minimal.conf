# ABOUTME: Hyprland theme - Minimal, nearly invisible window chrome
# ABOUTME: Thin borders, small gaps, no shadows, subtle blur

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 1
    col.active_border = rgba(d8dee966)
    col.inactive_border = rgba(d8dee916)
    layout = dwindle
}

decoration {
    rounding = 2
    blur {
        enabled = true
        size = 3
        passes = 1
        new_optimizations = true
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = snappy, 0.05, 0.9, 0.1, 1.0
    animation = windows, 1, 3, snappy
    animation = windowsOut, 1, 3, snappy, popin 90%
    animation = fade, 1, 3, snappy
    animation = workspaces, 1, 2, snappy
}
