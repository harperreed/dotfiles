# ABOUTME: Hyprland theme - Fade, barely-there borders, ultra minimal
# ABOUTME: Thin translucent borders, subtle shadow, gentle rounding

general {
    gaps_in = 3
    gaps_out = 6
    border_size = 1
    col.active_border = rgba(c8c8d2aa)
    col.inactive_border = rgba(c8c8d218)
    layout = dwindle
}

decoration {
    rounding = 6
    blur {
        enabled = true
        size = 4
        passes = 1
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 8
        render_power = 2
        color = rgba(0f0f1444)
    }
}

animations {
    enabled = true
    bezier = gentle, 0.1, 0.9, 0.2, 1.0
    animation = windows, 1, 5, gentle
    animation = windowsOut, 1, 4, gentle, popin 85%
    animation = fade, 1, 4, gentle
    animation = workspaces, 1, 3, gentle
}
