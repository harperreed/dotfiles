# ABOUTME: Hyprland theme - Matrix, green phosphor on black void
# ABOUTME: Thin green borders, no rounding, minimal blur, hacker mode

general {
    gaps_in = 1
    gaps_out = 2
    border_size = 1
    col.active_border = rgba(00ff41ff)
    col.inactive_border = rgba(00ff4122)
    layout = dwindle
}

decoration {
    rounding = 0
    blur {
        enabled = true
        size = 2
        passes = 1
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 8
        render_power = 2
        color = rgba(00ff4122)
    }
}

animations {
    enabled = true
    bezier = sharp, 0.0, 0.9, 0.0, 1.0
    animation = windows, 1, 2, sharp
    animation = windowsOut, 1, 2, sharp
    animation = fade, 1, 2, sharp
    animation = workspaces, 1, 2, sharp
}
