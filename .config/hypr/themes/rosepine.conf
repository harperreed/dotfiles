# ABOUTME: Hyprland theme - Rosé Pine, muted pinks and golds, romantic
# ABOUTME: Soft borders, gentle shadows, dreamy rounding

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(c4a7e7ff) rgba(ebbcbaff) 45deg
    col.inactive_border = rgba(26233588)
    layout = dwindle
}

decoration {
    rounding = 12
    blur {
        enabled = true
        size = 7
        passes = 2
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 14
        render_power = 3
        color = rgba(191724dd)
    }
}

animations {
    enabled = true
    bezier = gentle, 0.1, 0.9, 0.2, 1.0
    animation = windows, 1, 6, gentle
    animation = windowsOut, 1, 5, gentle, popin 80%
    animation = fade, 1, 5, gentle
    animation = workspaces, 1, 4, gentle
}
