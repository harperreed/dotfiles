# ABOUTME: Hyprland theme - Gruvbox, warm retro with earthy borders
# ABOUTME: Orange/yellow active borders, soft rounding, cozy gaps

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 3
    col.active_border = rgba(fabd2fff) rgba(fe8019ff) 45deg
    col.inactive_border = rgba(3c3836aa)
    layout = dwindle
}

decoration {
    rounding = 6
    blur {
        enabled = true
        size = 5
        passes = 2
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 10
        render_power = 2
        color = rgba(1d2021cc)
    }
}

animations {
    enabled = true
    bezier = snappy, 0.05, 0.9, 0.1, 1.0
    animation = windows, 1, 5, snappy
    animation = windowsOut, 1, 5, snappy, popin 75%
    animation = fade, 1, 4, snappy
    animation = workspaces, 1, 4, snappy
}
